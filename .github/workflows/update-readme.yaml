name: update-readme

on:
  push:
    branches: [main]
    paths:
      - Formula/**
      - Casks/**
      - .github/tap-icons.txt
      - .github/scripts/update-readme.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Regenerate the README tables
        run: .github/scripts/update-readme.sh
      - name: Commit the change
        run: |
          if git diff --quiet -- README.md; then
            echo "README tables are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README tables"
          git push
